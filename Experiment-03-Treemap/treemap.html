<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>汽车层级矩形树图可视化</title>
  <link rel="stylesheet" href="treemap.css" />
</head>
<body>
  <main class="page">
    <h1>汽车车型、品牌与价格层级矩形树图</h1>
    <p class="intro">
      矩形面积表示零售价格，颜色表示车型类别。移动鼠标查看详情，点击车型可显示选中信息。
    </p>

    <section class="info-card">
      <div id="status">正在读取数据……</div>
      <div id="selected-info">请点击任意车型矩形查看详细信息。</div>
    </section>

    <section class="chart-card">
      <div id="chart"></div>
    </section>
  </main>

  <div id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="treemap.js"></script>
</body>
</html>
